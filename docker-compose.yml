services:
  db:
    image: mysql:8.4
    container_name: learningwebsite-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learn_schema}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: learningwebsite-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      DB_NAME: ${MYSQL_DATABASE:-learn_schema}
    ports:
      - "5000:5000"
    volumes:
      - topic_uploads:/app/uploads
      - ./topic_uploads.tar.gz:/seed/topic_uploads.tar.gz:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  topic_uploads:
